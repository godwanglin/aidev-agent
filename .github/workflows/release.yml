name: Release Aidev Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-workflow
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build Next.js Web Bundle
        run: |
          npm run build > build.log 2>&1 || true
          echo "=== [WINDOWS NEXT.JS BUILD LOG] ==="
          cat build.log
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "Error: Next.js build failed to produce .next/BUILD_ID"
            exit 1
          fi

      - name: Upload Windows Next Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-next-build-log
          path: build.log

      - name: Compile Electron Main Process
        run: npm run build:electron

      - name: Clean Next.js internal build folders
        run: rm -rf .next/node_modules .next/types .next/diagnostics

      - name: Prune non-runtime files from node_modules
        run: node scripts/prune-node-modules.mjs

      - name: Build Windows Online & Offline Installers (.exe)
        run: |
          npx electron-builder --win nsis-web --publish never
          if [ -d "release/nsis-web" ]; then
            cp -f release/nsis-web/*.exe release/ || true
            cp -f release/nsis-web/*.7z release/ || true
          fi
          npx electron-builder --win nsis --publish never
          ls -lh release/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/*.7z
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn

  build-linux:
    name: Build Linux Packages (AppImage, deb, tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2t64 libfuse2 libarchive-tools desktop-file-utils || true

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build Next.js Web Bundle
        run: |
          npm run build > build.log 2>&1 || true
          echo "=== [LINUX NEXT.JS BUILD LOG] ==="
          cat build.log
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "Error: Next.js build failed to produce .next/BUILD_ID"
            exit 1
          fi

      - name: Upload Linux Next Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-next-build-log
          path: build.log

      - name: Compile Electron Main Process
        run: npm run build:electron

      - name: Clean Next.js internal build symlinks
        run: |
          rm -rf .next/node_modules .next/types .next/diagnostics
          find .next -type l -delete || true

      - name: Prune non-runtime files from node_modules
        run: node scripts/prune-node-modules.mjs

      - name: Build Linux Desktop Packages (AppImage, deb, tar.gz)
        run: npx electron-builder --linux --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          USE_HARD_LINKS: "false"

      - name: Package Linux Standalone Web Runner
        run: |
          tar -czf release/aidev-linux-web.tar.gz \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='release' \
            --exclude='.git' \
            .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Aidev Desktop ${{ steps.tag_info.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
