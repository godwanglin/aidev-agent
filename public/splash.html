<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aidev Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #14161f 0%, #0c0d12 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    /* Top Draggable Bar with Window Controls */
    .titlebar {
      width: 100%;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 4px;
      -webkit-app-region: drag;
      z-index: 10;
    }
    .window-controls {
      display: flex;
      align-items: center;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      width: 40px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #71717a;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
    }
    .win-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .win-btn.close:hover {
      background: #e81123;
      color: #ffffff;
    }
    .win-btn svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    /* Centered Glowing Logo */
    .splash-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-breathing 2.4s ease-in-out infinite;
    }

    .logo-glow {
      position: absolute;
      width: 150px;
      height: 100px;
      border-radius: 40px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(37, 99, 235, 0.2) 60%, transparent 100%);
      filter: blur(28px);
      z-index: 1;
      animation: glow-expansion 2.4s ease-in-out infinite;
    }

    .logo-img {
      position: relative;
      width: 120px;
      height: auto;
      max-height: 80px;
      object-fit: contain;
      z-index: 2;
      filter: drop-shadow(0 10px 24px rgba(37, 99, 235, 0.35));
    }

    @keyframes pulse-breathing {
      0%, 100% {
        transform: scale(0.96);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes glow-expansion {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.85;
      }
    }
  </style>
</head>
<body>
  <!-- Titlebar with Window Controls -->
  <div class="titlebar">
    <div class="window-controls">
      <button class="win-btn" id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="win-btn" id="btn-maximize" title="Maximize">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"></rect></svg>
      </button>
      <button class="win-btn close" id="btn-close" title="Close">
        <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
      </button>
    </div>
  </div>

  <!-- Centered Logo -->
  <div class="splash-container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="logo.png" class="logo-img" alt="Aidev" />
    </div>
  </div>

  <script>
    const api = window.electronAPI;
    if (api) {
      document.getElementById('btn-minimize')?.addEventListener('click', () => api.minimize?.());
      document.getElementById('btn-maximize')?.addEventListener('click', () => api.maximize?.());
      document.getElementById('btn-close')?.addEventListener('click', () => api.close?.());
    }
  </script>
</body>
</html>
